services:
  neon-tetris:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 2.{YY}.{MM}.{git short hash} — задаёт deploy.sh (APP_VERSION=... docker compose build).
        # Пусто => в образе APP_VERSION пустой, health берёт version из backend/package.json,
        # а FE-бандл вычисляет версию сам (git недоступен в docker => хэш "dev").
        APP_VERSION: ${APP_VERSION:-}
    container_name: neon-tetris
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Действующий прод-контур: хостинг hshp + динамический DNS No-IP (ddns.net),
      # сертификат Let's Encrypt выдаёт acme-companion из nginx-proxy/. Домен не менять.
      - VIRTUAL_HOST=ntetris.ddns.net
      - VIRTUAL_PORT=3000
      - VIRTUAL_PATH=/
      - ACME_HOST=ntetris.ddns.net
      # MP-логи матчей: один JSONL на матч в ./backend/data/mp-matches (volume ниже),
      # старые файлы удаляются сами после MP_LOG_MAX_FILES (по умолчанию 300).
      # Чтение логов по HTTP (GET /api/mp/matches) закрыто, пока не задан MP_ADMIN_TOKEN:
      # пусто => эндпоинты отвечают 503, логи доступны только по SSH.
      # Значение хранится в /opt/neon-tetris/.env на сервере (его не касается git и rsync).
      - MP_ADMIN_TOKEN=${MP_ADMIN_TOKEN:-}
      - MP_LOGS=${MP_LOGS:-1}
      - MP_LOG_MAX_FILES=${MP_LOG_MAX_FILES:-300}
    volumes:
      - ./backend/data:/app/backend/data:rw
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: proxy
