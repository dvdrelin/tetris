version: '3.8'

services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy-acme:latest
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx-proxy-conf:/etc/nginx/conf.d:rw
      - nginx-proxy-certs:/etc/nginx/certs:rw
      - nginx-proxy-dhparam:/etc/nginx/dhparam:ro
      - nginx-proxy-static:/etc/nginx/static:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/resolv.conf:/etc/resolv.conf:ro
    environment:
      - HTTPS=force
      - EMAIL=dvdrelin@gmail.com
    networks:
      - proxy

volumes:
  nginx-proxy-conf:
    driver: local
  nginx-proxy-dhparam:
    driver: local
  nginx-proxy-certs:
    driver: local
  nginx-proxy-static:
    driver: local

networks:
  proxy:
    name: proxy
